<rect width="1280" height="640" fill="#000"/>
<g fill="#fff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="88" y="116" font-size="14" letter-spacing="2.4" fill="#a8a8a8">A VISUAL LANGUAGE FOR SPACECRAFT</text>
<text x="82" y="249" font-size="80" font-weight="700" letter-spacing="-3">SEMIOTIC</text>
<text x="82" y="334" font-size="80" font-weight="700" letter-spacing="-3">STANDARD</text>
<text x="88" y="391" font-size="23" fill="#bdbdbd">Ron Cobb’s symbols for Alien (1979).</text>
<text x="88" y="429" font-size="19" fill="#bdbdbd">34 symbols. One interactive reference.</text>
<path d="M88 510H1192" stroke="#333"/>
<text x="88" y="552" font-size="20" font-weight="500">semioticstandard.org</text>
