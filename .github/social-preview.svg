<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Semiotic Standard — Ron Cobb’s spacecraft symbols</title>
<desc id="desc">Black repository share card with a white title and twelve original red, white, yellow, blue and green spacecraft symbols. An interactive reference for Alien (1979).</desc>
<!-- 1280 × 640 GitHub template; all visible content stays inside an 80px safe area.
     Symbol vectors: LouH, based on Brandon Gamm and Ron Cobb; CC BY 4.0.
